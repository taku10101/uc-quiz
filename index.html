<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UC級 一問一答</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap"
/>
<style>
  /* Layout: 単一カラムの学習カード。上に成績と章フィルタ、中央に1問、下に前後ナビ */
  :root {
    --bg: #edf0f4;
    --surface: #ffffff;
    --fg: #17202d;
    --muted: #586376;
    --line: #d3dae3;
    --chip: #e2e7ee;
    --accent: #1d5fa6;
    --accent-ink: #ffffff;
    --ok: #1d5fa6;
    --ok-bg: #e2ecf8;
    --ng: #bf4e08;
    --ng-bg: #fbe8d9;
    --font-body:
      "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    --font-mono:
      "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10141a;
      --surface: #19202a;
      --fg: #e6eaf0;
      --muted: #9aa5b4;
      --line: #2c3442;
      --chip: #232b37;
      --accent: #72aaea;
      --accent-ink: #0e1520;
      --ok: #72aaea;
      --ok-bg: #1a2b41;
      --ng: #f2934f;
      --ng-bg: #3a2416;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10141a;
    --surface: #19202a;
    --fg: #e6eaf0;
    --muted: #9aa5b4;
    --line: #2c3442;
    --chip: #232b37;
    --accent: #72aaea;
    --accent-ink: #0e1520;
    --ok: #72aaea;
    --ok-bg: #1a2b41;
    --ng: #f2934f;
    --ng-bg: #3a2416;
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  [hidden] {
    display: none !important;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.7;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding-block: 28px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid;
    gap: 18px;
  }
  header {
    display: grid;
    gap: 10px;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--muted);
  }
  h1 {
    margin: 0;
    font-size: 28px;
    line-height: 1.3;
    text-wrap: balance;
  }
  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 20px;
    color: var(--muted);
    font-size: 13px;
  }
  .stats b {
    color: var(--fg);
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    margin-right: 2px;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  button {
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .chip {
    border: 1px solid transparent;
    background: var(--chip);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 13px;
    display: inline-flex;
    gap: 8px;
    align-items: baseline;
  }
  .chip .n {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .chip[aria-pressed="true"] {
    background: var(--fg);
    color: var(--bg);
  }
  .chip[aria-pressed="true"] .n {
    color: inherit;
    opacity: 0.75;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 14px;
    align-items: center;
  }
  .seg {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    background: var(--surface);
  }
  .seg button {
    border: 0;
    background: transparent;
    padding: 6px 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .seg button + button {
    border-left: 1px solid var(--line);
  }
  .seg button[aria-pressed="true"] {
    background: var(--accent);
    color: var(--accent-ink);
  }
  .toggle {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    color: var(--muted);
    display: inline-flex;
    gap: 6px;
    align-items: center;
  }
  .toggle::before {
    content: "";
    width: 12px;
    height: 12px;
    border-radius: 3px;
    border: 1.5px solid currentColor;
  }
  .toggle[aria-pressed="true"] {
    color: var(--fg);
    border-color: var(--fg);
  }
  .toggle[aria-pressed="true"]::before {
    background: var(--accent);
    border-color: var(--accent);
  }
  .spacer {
    flex: 1;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 22px 18px;
    display: grid;
    gap: 18px;
    min-width: 0;
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
  }
  .qno {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
  }
  .tag {
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 6px;
  }
  .hist {
    margin-left: auto;
    font-family: var(--font-mono);
  }
  .q {
    font-size: 18px;
    line-height: 1.85;
    margin: 0;
    overflow-wrap: anywhere;
  }
  .blank {
    display: inline-block;
    min-width: 4.5em;
    border-bottom: 2px solid var(--fg);
    padding: 0 4px;
    margin: 0 2px;
    text-align: center;
    line-height: 1.4;
  }
  .blank.filled {
    color: var(--accent);
    font-weight: 700;
    border-color: var(--accent);
  }
  .choices {
    display: grid;
    gap: 8px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .choice {
    width: 100%;
    text-align: left;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    padding: 10px 14px;
    display: flex;
    gap: 12px;
    align-items: baseline;
  }
  .choice:hover:not(:disabled) {
    border-color: var(--fg);
  }
  .choice:disabled {
    cursor: default;
  }
  .choice .k {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    min-width: 1.2em;
  }
  .choice .mk {
    margin-left: auto;
    font-weight: 700;
  }
  .choice.is-ok {
    background: var(--ok-bg);
    border-color: var(--ok);
  }
  .choice.is-ok .mk {
    color: var(--ok);
  }
  .choice.is-ng {
    background: var(--ng-bg);
    border-color: var(--ng);
  }
  .choice.is-ng .mk {
    color: var(--ng);
  }
  .tf {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .tf .choice {
    justify-content: center;
    font-size: 22px;
    padding: 12px;
  }
  .tf .choice .k {
    position: absolute;
    opacity: 0;
  }
  .primary {
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    padding: 12px 18px;
    font-weight: 700;
    justify-self: start;
  }
  .kbd {
    font-family: var(--font-mono);
    font-size: 11px;
    opacity: 0.75;
    margin-left: 6px;
  }
  .answer {
    border-top: 1px solid var(--line);
    padding-top: 16px;
    display: grid;
    gap: 10px;
    min-width: 0;
  }
  .verdict {
    display: inline-flex;
    gap: 8px;
    align-items: center;
    font-weight: 700;
  }
  .verdict.ok {
    color: var(--ok);
  }
  .verdict.ng {
    color: var(--ng);
  }
  .ans-label {
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .ans-text {
    font-size: 17px;
    font-weight: 700;
    overflow-wrap: anywhere;
    white-space: pre-line;
  }
  .exp {
    color: var(--muted);
    margin: 0;
    overflow-wrap: anywhere;
  }
  .grade {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .grade button {
    border-radius: 10px;
    padding: 10px 16px;
    font-weight: 700;
    border: 1.5px solid;
    background: var(--surface);
  }
  .grade .g-ok {
    color: var(--ok);
    border-color: var(--ok);
  }
  .grade .g-ng {
    color: var(--ng);
    border-color: var(--ng);
  }
  .nav {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .nav button {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 8px;
    padding: 8px 14px;
  }
  .nav button:disabled {
    opacity: 0.4;
    cursor: default;
  }
  .nav .pos {
    flex: 1;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .bar {
    height: 4px;
    background: var(--chip);
    border-radius: 2px;
    overflow: hidden;
  }
  .bar i {
    display: block;
    height: 100%;
    background: var(--accent);
  }
  .empty {
    color: var(--muted);
  }
  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .q:focus,
  .answer:focus {
    outline: none;
  }
  .cleared {
    color: var(--ok);
    font-weight: 700;
    margin: 0;
  }

  .list {
    display: grid;
    gap: 22px;
  }
  .list h2 {
    font-size: 16px;
    margin: 0 0 8px;
  }
  .list ol {
    margin: 0;
    padding: 0;
    list-style: none;
    display: grid;
    gap: 6px;
  }
  .list details {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .list summary {
    cursor: pointer;
    overflow-wrap: anywhere;
  }
  .list summary .m {
    font-family: var(--font-mono);
    font-size: 12px;
    margin-right: 8px;
  }
  .list .m.ok {
    color: var(--ok);
  }
  .list .m.ng {
    color: var(--ng);
  }
  .list .a {
    margin-top: 8px;
    font-weight: 700;
    white-space: pre-line;
  }
  .list .e {
    color: var(--muted);
    font-size: 14px;
  }

  footer {
    color: var(--muted);
    font-size: 12px;
    display: grid;
    gap: 8px;
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }
  footer p {
    margin: 0;
  }
  .reset {
    justify-self: start;
    border: 1px solid var(--line);
    background: transparent;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .reset.armed {
    color: var(--ng);
    border-color: var(--ng);
  }
  @media (max-width: 520px) {
    h1 {
      font-size: 24px;
    }
    .card {
      padding: 18px 16px 14px;
    }
    .q {
      font-size: 17px;
    }
    .spacer {
      display: none;
    }
    .chips {
      flex-wrap: nowrap;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }
    .chip {
      flex: none;
    }
  }
  @media (prefers-reduced-motion: no-preference) {
    .answer {
      animation: rise 0.18s ease-out;
    }
    @keyframes rise {
      from {
        transform: translateY(4px);
        opacity: 0.6;
      }
      to {
        transform: none;
        opacity: 1;
      }
    }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">色彩検定 UC級（色のユニバーサルデザイン）対策</div>
    <h1>UC級 一問一答</h1>
    <div class="stats" id="stats"></div>
  </header>
  <nav class="chips" id="chips" aria-label="章で絞り込む"></nav>
  <div class="controls">
    <div class="seg" role="group" aria-label="表示">
      <button type="button" id="v-quiz" data-view="quiz">出題</button>
      <button type="button" id="v-list" data-view="list">一覧</button>
    </div>
    <div class="seg" role="group" aria-label="出題順">
      <button type="button" id="o-seq" data-order="seq">順番</button>
      <button type="button" id="o-rnd" data-order="random">ランダム</button>
    </div>
    <span class="spacer"></span>
    <button type="button" class="toggle" id="t-choices">4択で解く</button>
    <button type="button" class="toggle" id="t-weak">まちがえた問題だけ</button>
  </div>
  <main id="quiz"></main>
  <section class="list" id="list" hidden></section>
  <footer>
    <p>
      公式テキスト（2022年改訂版）の6章構成に沿って作成した非公式の練習問題です。過去問の出題形式（空欄補充・正誤）にならっていますが、実際の過去問ではありません。「発展」は出題範囲外の可能性がある補足です。
    </p>
    <p>
      正解は青と○、不正解は朱と×で示しています。1型・2型色覚でも区別しやすい色の組み合わせに、記号を併記しています。
    </p>
    <p>
      キー操作：Space で答えを見る／次へ、1〜4 で選択・自己採点、← →
      で前後の問題。
    </p>
    <button type="button" class="reset" id="reset">解答記録をリセット</button>
  </footer>
</div>

<script>
  const CH = {
    1: "色のUDの考え方",
    2: "色が見えるしくみ",
    3: "色の表し方",
    4: "色覚タイプと見え方",
    5: "高齢者・ロービジョン",
    6: "色のUDの進め方",
  };

  // t: blank = 空欄補充（a が正解、o が誤答の選択肢）/ tf = 正誤 / free = 記述
  // x: 1 = 発展（出題範囲外の可能性）
  const D = [
    // 第1章 色のUDの考え方
    {
      c: 1,
      q: "ユニバーサルデザインの考え方を1980年代に提唱したのは、米国ノースカロライナ州立大学の【　　】である。",
      a: "ロナルド・メイス",
      o: ["ヴィクター・パパネック", "ヨハネス・イッテン", "ドナルド・ノーマン"],
      e: "メイスは建築家・工業デザイナーで、自身も車いすを使っていた。",
    },
    {
      c: 1,
      q: "ユニバーサルデザインとは、年齢・性別・国籍・能力などにかかわらず、【　　】が利用しやすいよう、はじめから考えて設計することである。",
      a: "できるだけ多くの人",
      o: ["障害のある人だけ", "高齢者だけ", "特定の専門家"],
      e: "特定の人への特別な配慮ではなく、最初から多様な利用者を想定する点が要点。",
    },
    {
      c: 1,
      t: "tf",
      q: "バリアフリーは既にある障壁（バリア）を後から取り除くという考え方であり、ユニバーサルデザインははじめから障壁が生じないように設計するという考え方である。",
      a: "○",
      e: "両者の違いは頻出。UDは対象を障害のある人に限らない。",
    },
    {
      c: 1,
      q: "UDの7原則のうち、「誰にでも公平に利用できること」を示す原則は【　　】である。",
      a: "公平な利用",
      o: ["利用における柔軟性", "認知できる情報", "失敗に対する寛大さ"],
      e: "原則1。特定の利用者を差別したり、取り残したりしない。",
    },
    {
      c: 1,
      q: "UDの7原則のうち、「使ううえで自由度が高いこと（利き手や使い方を選べるなど）」を示す原則は【　　】である。",
      a: "利用における柔軟性",
      o: ["公平な利用", "単純で直感的な利用", "少ない身体的な努力"],
      e: "原則2。個人の好みや能力に合わせて使い方を選べる。",
    },
    {
      c: 1,
      q: "UDの7原則のうち、「使い方が簡単で、すぐにわかること」を示す原則は【　　】である。",
      a: "単純で直感的な利用",
      o: ["認知できる情報", "公平な利用", "失敗に対する寛大さ"],
      e: "原則3。経験・知識・言語能力などにかかわらず使い方がわかる。",
    },
    {
      c: 1,
      q: "UDの7原則のうち、「必要な情報がすぐに理解できること」を示す原則は【　　】である。",
      a: "認知できる情報",
      o: [
        "単純で直感的な利用",
        "利用における柔軟性",
        "接近や利用のためのサイズと空間",
      ],
      e: "原則4。周囲の状況や利用者の感覚能力にかかわらず、必要な情報が効果的に伝わる。色のUDと特に関わりが深い。",
    },
    {
      c: 1,
      q: "UDの7原則のうち、「うっかりミスや危険につながらないこと」を示す原則は【　　】である。",
      a: "失敗に対する寛大さ",
      o: ["少ない身体的な努力", "公平な利用", "認知できる情報"],
      e: "原則5。誤った操作をしても危険や不利な結果につながりにくい。",
    },
    {
      c: 1,
      q: "UDの7原則のうち、「無理な姿勢や強い力を必要とせず、楽に使えること」を示す原則は【　　】である。",
      a: "少ない身体的な努力",
      o: [
        "利用における柔軟性",
        "接近や利用のためのサイズと空間",
        "単純で直感的な利用",
      ],
      e: "原則6。",
    },
    {
      c: 1,
      q: "UDの7原則のうち、「近づきやすく使いやすい大きさと空間を確保すること」を示す原則は【　　】である。",
      a: "接近や利用のためのサイズと空間",
      o: ["少ない身体的な努力", "公平な利用", "失敗に対する寛大さ"],
      e: "原則7。体格や姿勢、移動能力にかかわらず利用できる大きさと広さ。",
    },
    {
      c: 1,
      t: "tf",
      q: "UDの7原則のうち、色のUDと特に関わりが深いのは「失敗に対する寛大さ」である。",
      a: "×",
      e: "特に関わりが深いのは原則4「認知できる情報」。色で示した情報が誰にでも伝わるようにすることが色のUDの中心。",
    },
    {
      c: 1,
      q: "障害のある人もない人も、地域の中で同じように普通の生活を送れる社会をめざす考え方を【　　】という。",
      a: "ノーマライゼーション",
      o: ["インクルーシブデザイン", "ユーザビリティ", "アクセシビリティ"],
      e: "デンマークのバンク＝ミケルセンが提唱したとされる。",
    },
    {
      c: 1,
      q: "製品・サービス・情報などに、高齢者や障害のある人を含む誰もが支障なくアクセスし利用できる度合いを【　　】という。",
      a: "アクセシビリティ",
      o: ["ユーザビリティ", "ノーマライゼーション", "バリアフリー"],
      e: "Webでは「Webアクセシビリティ」として、色だけに頼らない表現などが求められる。",
    },
    {
      c: 1,

    {
      c: 6,
      t: "free",
      q: "【記述】高齢者向けの案内表示をつくるとき、加齢による見え方の変化に配慮した配色の工夫を挙げなさい。",
      a: "・文字と背景の明度差を大きくする\n・白地に黄、青と黒、紺と黒などの組み合わせを避ける\n・まぶしさ（グレア）を抑えるため、光沢のある素材や明るすぎる白を避ける\n・文字は大きく太いゴシック体にする",
      e: "水晶体の黄変・白内障・縮瞳・コントラスト感度の低下と結び付けて説明できるようにする。",
    },
    {
      c: 6,
      t: "free",
      q: "【記述】5本の折れ線を色の違いだけで区別しているグラフを、色覚の多様性に配慮して改善する方法を挙げなさい。",
      a: "・線種（実線・破線など）やマーカーの形を変える\n・凡例ではなく、線の近くに系列名を直接書き込む\n・線を太くし、色同士の明度差を大きくする\n・使う色の数を減らす、強調したい系列だけ色を付ける",
      e: "線は面積が小さく、色だけでは区別しにくいことが前提。",
    },
  ];

  function hash(s) {
    let h = 5381;
    for (const ch of s) h = (h * 33 + ch.codePointAt(0)) >>> 0;
    return h.toString(36);
  }
  D.forEach((d) => {
    d.t = d.t || "blank";
    d.id = hash(d.q);
  });

  const S = {
    get(k, f) {
      try {
        const v = JSON.parse(localStorage.getItem(k));
        return v && typeof v === "object" && !Array.isArray(v) ? v : f;
      } catch (e) {
        return f;
      }
    },
    set(k, v) {
      try {
        localStorage.setItem(k, JSON.stringify(v));
      } catch (e) {
        /* 保存できなくても動作は続ける */
      }
    },
  };
  const prefs = Object.assign(
    { ch: "all", order: "seq", weak: false, choices: false, view: "quiz" },
    S.get("uc.prefs", {}),
  );
  if (prefs.ch !== "all" && !CH[prefs.ch]) prefs.ch = "all";
  let results = S.get("uc.results", {});
  const lastPos = S.get("uc.pos", {});
  let deck = [],
    pos = 0,
    answered = null;

  const $ = (id) => document.getElementById(id);
  const esc = (s) =>
    String(s).replace(
      /[&<>"]/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
    );

  function rng(seed) {
    let s = parseInt(seed, 36) || 1;
    return () => {
      s = (s * 1103515245 + 12345) >>> 0;
      return s / 4294967296;
    };
  }
  function choicesOf(d) {
    const arr = [d.a, ...d.o],
      r = rng(d.id);
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  const isWeak = (d) => results[d.id] && results[d.id].last === false;

  function buildDeck() {
    let list = D.filter((d) => prefs.ch === "all" || String(d.c) === prefs.ch);
    if (prefs.weak) list = list.filter(isWeak);
    if (prefs.order === "random") {
      list = list.slice();
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }
    }
    deck = list;
    answered = null;
    pos = 0;
    if (prefs.order === "seq" && !prefs.weak) {
      const i = deck.findIndex((d) => d.id === lastPos[prefs.ch]);
      if (i > 0) pos = i;
    }
  }

  function savePrefs() {
    S.set("uc.prefs", prefs);
  }
  function record(d, ok) {
    const p = results[d.id] || { n: 0, ok: 0 };
    results[d.id] = { n: p.n + 1, ok: p.ok + (ok ? 1 : 0), last: ok };
    S.set("uc.results", results);
  }

  function renderStats() {
    const done = D.filter((d) => results[d.id]);
    const good = done.filter((d) => results[d.id].last).length;
    const weak = done.length - good;
    const rate = done.length ? Math.round((good / done.length) * 100) : 0;
    $("stats").innerHTML =
      `<span><b>${done.length}</b>/ ${D.length} 問 解答済み</span>` +
      `<span>直近の正答率 <b>${rate}</b>%</span>` +
      `<span>まちがえた問題 <b>${weak}</b>問</span>`;
  }

  function renderChips() {
    const focused =
      document.activeElement && document.activeElement.dataset
        ? document.activeElement.dataset.ch
        : undefined;
    const keys = ["all", ...Object.keys(CH)];
    $("chips").innerHTML = keys
      .map((k) => {
        const qs = D.filter((d) => k === "all" || String(d.c) === k);
        const done = qs.filter((d) => results[d.id]).length;
        const label = k === "all" ? "すべて" : `第${k}章 ${CH[k]}`;
        return `<button type="button" class="chip" data-ch="${k}" aria-pressed="${prefs.ch === k}">${label}<span class="n">${done}/${qs.length}</span></button>`;
      })
      .join("");
    // 作り直したチップにキーボードフォーカスを戻す
    if (focused) {
      const b = $("chips").querySelector(`[data-ch="${focused}"]`);
      if (b) b.focus();
    }
  }

  function renderControls() {
    document
      .querySelectorAll("[data-view]")
      .forEach((b) =>
        b.setAttribute("aria-pressed", b.dataset.view === prefs.view),
      );
    document
      .querySelectorAll("[data-order]")
      .forEach((b) =>
        b.setAttribute("aria-pressed", b.dataset.order === prefs.order),
      );
    $("t-choices").setAttribute("aria-pressed", prefs.choices);
    $("t-weak").setAttribute("aria-pressed", prefs.weak);
  }

  function qHtml(d, filled) {
    const parts = esc(d.q).split("【　　】");
    if (parts.length === 1) return parts[0];
    const blank = filled
      ? `<span class="blank filled">${esc(d.a)}</span>`
      : `<span class="blank">　　<span class="sr">（空欄）</span></span>`;
    return parts.join(blank);
  }

  function histHtml(d) {
    const r = results[d.id];
    if (!r) return `<span class="hist">未解答</span>`;
    return `<span class="hist">前回 ${r.last ? "○" : "×"}（${r.ok}/${r.n}）</span>`;
  }

  function renderCard() {
    const el = $("quiz");
    if (!deck.length) {
      el.innerHTML = `<div class="card"><p class="empty">${prefs.weak ? "まちがえた問題はありません。「まちがえた問題だけ」を外すと全問から出題します。" : "この条件の問題はありません。"}</p></div>`;
      return;
    }
    const d = deck[pos];
    const kind = d.t === "tf" ? "正誤" : d.t === "free" ? "記述" : "空欄補充";
    const useChoices = d.t === "blank" && prefs.choices;
    let body = "";

    if (d.t === "tf") {
      body =
        `<div class="tf">` +
        ["○", "×"]
          .map((v, i) => {
            let cls = "";
            if (answered)
              cls = v === d.a ? " is-ok" : answered.pick === v ? " is-ng" : "";
            return `<button type="button" class="choice${cls}" data-act="tf" data-v="${v}" ${answered ? "disabled" : ""} aria-label="${v === "○" ? "正しい" : "誤り"}"><span class="k">${i + 1}</span>${v}</button>`;
          })
          .join("") +
        `</div>`;
    } else if (useChoices) {
      body =
        `<ol class="choices">` +
        choicesOf(d)
          .map((c, i) => {
            let cls = "",
              mk = "";
            if (answered) {
              if (c === d.a) {
                cls = " is-ok";
                mk = "○";
              } else if (answered.pick === c) {
                cls = " is-ng";
                mk = "×";
              }
            }
            return `<li><button type="button" class="choice${cls}" data-act="pick" data-i="${i}" ${answered ? "disabled" : ""}><span class="k">${i + 1}</span><span>${esc(c)}</span><span class="mk">${mk}</span></button></li>`;
          })
          .join("") +
        `</ol>`;
    } else if (!answered) {
      body = `<button type="button" class="primary" data-act="reveal">答えを見る<span class="kbd">Space</span></button>`;
    }

    let ans = "";
    if (answered) {
      const judged = answered.ok !== null;
      const verdict = judged
        ? `<div class="verdict ${answered.ok ? "ok" : "ng"}">${answered.ok ? "○ 正解" : "× 不正解"}</div>`
        : "";
      const grade = judged
        ? ""
        : `<div class="grade"><button type="button" class="g-ok" data-act="grade" data-ok="1">○ 正解だった<span class="kbd">1</span></button>` +
          `<button type="button" class="g-ng" data-act="grade" data-ok="0">× まちがえた<span class="kbd">2</span></button></div>`;
      const cleared =
        prefs.weak && answered.ok === true && !deck.some(isWeak)
          ? `<p class="cleared">まちがえた問題をすべて正解しました。「まちがえた問題だけ」を外すと全問から出題します。</p>`
          : "";
      ans = `<div class="answer" tabindex="-1">${verdict}
      <div><div class="ans-label">${d.t === "free" ? "解答例" : "正解"}</div><div class="ans-text">${esc(d.a)}</div></div>
      ${d.e ? `<p class="exp">${esc(d.e)}</p>` : ""}${grade}${cleared}</div>`;
    }

    const pct = Math.round(((pos + 1) / deck.length) * 100);
    el.innerHTML = `<div class="card">
    <div class="meta"><span class="qno">Q.${String(pos + 1).padStart(3, "0")}</span><span>第${d.c}章 ${CH[d.c]}</span><span class="tag">${kind}</span>${d.x ? `<span class="tag">発展</span>` : ""}${histHtml(d)}</div>
    <p class="q" tabindex="-1">${qHtml(d, !!answered)}</p>
    ${body}${ans}
    <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
    <div class="nav">
      <button type="button" data-act="prev" ${pos === 0 ? "disabled" : ""}>← 前へ</button>
      <span class="pos">${pos + 1} / ${deck.length}</span>
      <button type="button" data-act="next" ${pos === deck.length - 1 ? "disabled" : ""}>次へ →</button>
    </div></div>`;
  }

  function renderList() {
    const groups = Object.keys(CH).filter(
      (k) => prefs.ch === "all" || prefs.ch === k,
    );
    $("list").innerHTML =
      groups
        .map((k) => {
          let qs = D.filter((d) => String(d.c) === k);
          if (prefs.weak) qs = qs.filter(isWeak);
          if (!qs.length) return "";
          return (
            `<div><h2>第${k}章 ${CH[k]}</h2><ol>` +
            qs
              .map((d) => {
                const r = results[d.id];
                const m = r
                  ? `<span class="m ${r.last ? "ok" : "ng"}">${r.last ? "○" : "×"}</span>`
                  : `<span class="m">・</span>`;
                return `<li><details><summary>${m}${qHtml(d, false)}</summary><div class="a">${esc(d.a)}</div>${d.e ? `<div class="e">${esc(d.e)}</div>` : ""}</details></li>`;
              })
              .join("") +
            `</ol></div>`
          );
        })
        .join("") || `<p class="empty">該当する問題はありません。</p>`;
  }

  // focus: "q" = 問題文へ、"answer" = 解答欄へ（キーボード・読み上げ利用者が位置を見失わないように）
  function render(focus) {
    renderStats();
    renderChips();
    renderControls();
    const list = prefs.view === "list";
    $("quiz").hidden = list;
    $("list").hidden = !list;
    if (list) {
      renderList();
      return;
    }
    renderCard();
    const target =
      focus === "answer"
        ? document.querySelector("#quiz .answer")
        : focus === "q"
          ? document.querySelector("#quiz .q")
          : null;
    if (target) target.focus({ preventScroll: focus === "q" });
  }

  function go(delta) {
    const n = pos + delta;
    if (n < 0 || n >= deck.length) return;
    pos = n;
    answered = null;
    if (prefs.order === "seq" && !prefs.weak) {
      lastPos[prefs.ch] = deck[pos].id;
      S.set("uc.pos", lastPos);
    }
    render("q");
  }

  function act(a, data) {
    const d = deck[pos];
    if (!d) return;
    if (a === "prev") return go(-1);
    if (a === "next") return go(1);
    if (answered && a !== "grade") return;
    if (a === "tf") {
      const ok = data.v === d.a;
      answered = { pick: data.v, ok };
      record(d, ok);
    } else if (a === "pick") {
      const c = choicesOf(d)[+data.i];
      const ok = c === d.a;
      answered = { pick: c, ok };
      record(d, ok);
    } else if (a === "reveal") {
      answered = { pick: null, ok: null };
    } else if (a === "grade") {
      if (!answered || answered.ok !== null) return;
      answered.ok = data.ok === "1";
      record(d, answered.ok);
    }
    render("answer");
  }

  $("quiz").addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]");
    if (b && !b.disabled) act(b.dataset.act, b.dataset);
  });
  $("chips").addEventListener("click", (e) => {
    const b = e.target.closest("[data-ch]");
    if (!b) return;
    prefs.ch = b.dataset.ch;
    savePrefs();
    buildDeck();
    render();
  });
  document.querySelectorAll("[data-view]").forEach((b) =>
    b.addEventListener("click", () => {
      prefs.view = b.dataset.view;
      savePrefs();
      render();
    }),
  );
  document.querySelectorAll("[data-order]").forEach((b) =>
    b.addEventListener("click", () => {
      prefs.order = b.dataset.order;
      savePrefs();
      buildDeck();
      render();
    }),
  );
  $("t-choices").addEventListener("click", () => {
    prefs.choices = !prefs.choices;
    savePrefs();
    // 採点済みの回答は保持し、答えを見ただけで未採点のときだけ戻す
    if (answered && answered.ok === null) answered = null;
    render();
  });
  $("t-weak").addEventListener("click", () => {
    prefs.weak = !prefs.weak;
    savePrefs();
    buildDeck();
    render();
  });

  let resetTimer = null;
  $("reset").addEventListener("click", (e) => {
    const b = e.currentTarget;
    if (!b.classList.contains("armed")) {
      clearTimeout(resetTimer);
      b.classList.add("armed");
      b.textContent = "もう一度押すと記録を消去します";
      resetTimer = setTimeout(() => {
        b.classList.remove("armed");
        b.textContent = "解答記録をリセット";
      }, 4000);
      return;
    }
    clearTimeout(resetTimer);
    results = {};
    S.set("uc.results", results);
    b.classList.remove("armed");
    b.textContent = "記録を消去しました";
    resetTimer = setTimeout(() => {
      b.textContent = "解答記録をリセット";
    }, 2000);
    buildDeck();
    render();
  });

  document.addEventListener("keydown", (e) => {
    if (prefs.view !== "quiz" || e.metaKey || e.ctrlKey || e.altKey || e.repeat)
      return;
    if (e.target.closest && e.target.closest("input, select, textarea")) return;
    const d = deck[pos];
    if (!d) return;
    if (e.key === "ArrowRight") {
      e.preventDefault();
      go(1);
      return;
    }
    if (e.key === "ArrowLeft") {
      e.preventDefault();
      go(-1);
      return;
    }
    if (e.key === " " || e.key === "Enter") {
      if (e.target.closest && e.target.closest("button, summary, a")) return;
      e.preventDefault();
      if (!answered && d.t !== "tf" && !(d.t === "blank" && prefs.choices))
        act("reveal", {});
      else if (answered && answered.ok !== null) go(1);
      return;
    }
    const n = parseInt(e.key, 10);
    if (!n) return;
    if (answered && answered.ok === null && n <= 2)
      act("grade", { ok: n === 1 ? "1" : "0" });
    else if (!answered && d.t === "tf" && n <= 2)
      act("tf", { v: n === 1 ? "○" : "×" });
    else if (!answered && d.t === "blank" && prefs.choices && n <= 4)
      act("pick", { i: String(n - 1) });
  });

  buildDeck();
  render();
  const selChip = $("chips").querySelector('[aria-pressed="true"]');
  if (selChip) selChip.scrollIntoView({ inline: "nearest", block: "nearest" });
</script>
</body>
</html>
